# HTTP → HTTPS redirect (mapped as host 18261 → container 80)
server {
    listen 80;
    server_name _;
    return 301 https://$host:${PUBLIC_HTTPS_PORT}$request_uri;
}

# HTTPS app (mapped as host 18262 → container 443)
server {
    listen 443 ssl;
    http2 on;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 50m;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Required for getUserMedia / getDisplayMedia in Chromium
    add_header Permissions-Policy "microphone=*, camera=*, display-capture=*, autoplay=*" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

    # Resolve Docker DNS at request time so nginx can start even if
    # upstream containers (minio/webapi) are briefly offline.
    resolver 127.0.0.11 valid=10s ipv6=off;
    # Host-only variables — do NOT put a path in proxy_pass with variables
    # (that breaks URI rewriting and returns 404 for /api/...).
    set $webapi_host webapi;
    set $minio_host minio;

    # SPA: try file, then index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header Permissions-Policy "microphone=*, camera=*, display-capture=*, autoplay=*" always;
    }

    # Path-style MinIO/S3 through the same origin so mobile LAN clients are not
    # given unreachable http://localhost:9000 presigned URLs.
    location ~ ^/(voice-call-app|volera-media)/ {
        proxy_pass http://$minio_host:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        client_max_body_size 50m;
        proxy_request_buffering off;
    }

    # API — full original URI (/api/v1/...) is forwarded to webapi
    # Use $http_host (includes port) so Storage RequestHost signs
    # https://192.168.x.x:18262/... not https://192.168.x.x/... (port 443).
    location /api/ {
        proxy_pass http://$webapi_host:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_request_buffering off;
        client_max_body_size 50m;
    }

    location /health {
        proxy_pass http://$webapi_host:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /version {
        proxy_pass http://$webapi_host:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
    }

    # SignalR hubs (WebSocket)
    location ~ ^/(callHub|chatHub|guestHub|companyWidgetHub|supportHub|aiWidgetHub) {
        proxy_pass http://$webapi_host:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
    }

    # Static assets cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
