<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voice Call App</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>
  </head>
  <body>
    <div id="app">
      <div id="auth" class="screen">
        <h2>Login</h2>
        <form id="loginForm">
          <input type="text" id="username" placeholder="Username" required />
          <input
            type="password"
            id="password"
            placeholder="Password"
            required
          />
          <button type="submit">Login</button>
        </form>
        <p>Don't have an account? <a href="#" id="showRegister">Register</a></p>
      </div>

      <div id="register" class="screen hidden">
        <h2>Register</h2>
        <form id="registerForm">
          <input
            type="text"
            id="regFirstName"
            placeholder="First Name"
            required
          />
          <input
            type="text"
            id="regLastName"
            placeholder="Last Name"
            required
          />
          <input type="text" id="regUsername" placeholder="Username" required />
          <input
            type="text"
            id="regPhone"
            placeholder="Phone Number"
            required
          />
          <input
            type="password"
            id="regPassword"
            placeholder="Password"
            required
          />
          <button type="submit">Register</button>
        </form>
        <p>Already have an account? <a href="#" id="showLogin">Login</a></p>
      </div>

      <div id="main" class="screen hidden">
        <header>
          <h1>Voice Call App</h1>
          <button id="logoutBtn">Logout</button>
        </header>
        <div id="content">
          <div id="usersList">
            <h2>Users</h2>
            <ul id="users"></ul>
          </div>
          <div id="callInterface">
            <div id="incomingCall" class="hidden">
              <p id="callerName">Incoming call from ...</p>
              <button id="acceptCall">Accept</button>
              <button id="rejectCall">Reject</button>
            </div>
            <div id="ongoingCall" class="hidden">
              <p id="callStatus">On call with ...</p>
              <button id="endCall">End Call</button>
              <audio id="remoteAudio" autoplay></audio>
              <audio id="localAudio" autoplay muted></audio>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
