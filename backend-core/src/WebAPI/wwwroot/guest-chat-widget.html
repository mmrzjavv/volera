<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guest Chat Widget Sample</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; margin: 0; min-height: 100vh; padding: 24px; background: #fafafa; color: #1a1a1a; }

    .page-intro { max-width: 480px; font-size: 0.9375rem; line-height: 1.5; color: #666; }

    #guest-chat-widget { position: fixed; bottom: 20px; right: 20px; z-index: 9999; font-size: 14px; }

    #guest-chat-toggle {
      width: 52px; height: 52px; border-radius: 50%;
      background: #0f0f0f; color: #fff; border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.15s ease, background 0.15s ease;
      box-shadow: 0 2px 12px rgba(0,0,0,0.15);
    }
    #guest-chat-toggle:hover { background: #333; transform: scale(1.04); }
    #guest-chat-toggle svg { width: 24px; height: 24px; }
    #guest-chat-toggle.open { background: #333; }

    #guest-chat-panel {
      display: none; position: absolute; bottom: 64px; right: 0;
      width: 360px; max-width: calc(100vw - 40px); height: 460px; max-height: 75vh;
      background: #fff; border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,0.08);
      flex-direction: column; overflow: hidden; border: 1px solid rgba(0,0,0,0.06);
    }
    #guest-chat-panel.visible { display: flex; animation: fadeIn 0.2s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    .chat-header {
      padding: 14px 16px; border-bottom: 1px solid #eee;
      display: flex; align-items: center; justify-content: space-between; background: #fff;
    }
    .chat-header h2 { margin: 0; font-size: 0.9375rem; font-weight: 600; color: #1a1a1a; }
    .chat-header .status { font-size: 0.75rem; color: #888; font-weight: 400; margin-top: 2px; }
    .chat-header button {
      background: none; border: none; color: #888; cursor: pointer; padding: 6px; line-height: 1;
      font-size: 1.1rem; transition: color 0.15s;
    }
    .chat-header button:hover { color: #1a1a1a; }

    .config-bar {
      padding: 8px 12px; background: #f8f8f8; border-bottom: 1px solid #eee;
      font-size: 0.75rem; color: #888;
    }
    .config-bar summary { cursor: pointer; user-select: none; }
    .config-bar input { width: 100%; max-width: 280px; padding: 6px 10px; margin-top: 6px; border: 1px solid #e0e0e0; border-radius: 6px; font-size: 0.8rem; }
    .config-bar[open] summary { margin-bottom: 6px; }

    .chat-start-form {
      padding: 20px; flex: 1; display: flex; flex-direction: column; gap: 14px;
    }
    .chat-start-form .hint { font-size: 0.8rem; color: #888; margin-bottom: 4px; }
    .chat-start-form label { font-size: 0.8125rem; color: #444; font-weight: 500; display: block; margin-bottom: 4px; }
    .chat-start-form input {
      width: 100%; padding: 10px 12px; border: 1px solid #e5e5e5; border-radius: 8px;
      font-size: 0.875rem; background: #fafafa; transition: border-color 0.15s, background 0.15s;
    }
    .chat-start-form input:focus { outline: none; border-color: #999; background: #fff; }
    .chat-start-form input::placeholder { color: #aaa; }
    .chat-start-form .error { font-size: 0.8125rem; color: #c00; margin-top: 4px; }
    .chat-start-form button[type="submit"] {
      margin-top: 6px; padding: 11px 16px; background: #0f0f0f; color: #fff; border: none;
      border-radius: 8px; font-size: 0.875rem; font-weight: 500; cursor: pointer; transition: background 0.15s;
    }
    .chat-start-form button[type="submit"]:hover { background: #333; }

    .chat-messages {
      flex: 1; overflow-y: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px;
      background: #fafafa;
    }
    .chat-message { max-width: 82%; padding: 9px 12px; border-radius: 14px; word-break: break-word; font-size: 0.875rem; line-height: 1.4; }
    .chat-message.sent { align-self: flex-end; background: #0f0f0f; color: #fff; border-bottom-right-radius: 4px; }
    .chat-message.received { align-self: flex-start; background: #fff; color: #1a1a1a; border: 1px solid #eee; border-bottom-left-radius: 4px; }
    .chat-message .time { font-size: 0.7rem; opacity: 0.75; margin-top: 4px; }
    .chat-message.received .time { color: #888; }

    .chat-input-area {
      padding: 10px 12px; border-top: 1px solid #eee; background: #fff; display: flex; gap: 8px; align-items: center;
    }
    .chat-input-area input {
      flex: 1; padding: 10px 14px; border: 1px solid #e5e5e5; border-radius: 20px;
      font-size: 0.875rem; background: #fafafa; transition: border-color 0.15s, background 0.15s;
    }
    .chat-input-area input:focus { outline: none; border-color: #999; background: #fff; }
    .chat-input-area button {
      width: 38px; height: 38px; border-radius: 50%; background: #0f0f0f; color: #fff; border: none;
      cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
      font-size: 0.875rem; transition: background 0.15s;
    }
    .chat-input-area button:hover { background: #333; }
    .chat-input-area button:disabled { opacity: 0.5; cursor: not-allowed; }

    #guest-chat-room { display: none; flex: 1; flex-direction: column; overflow: hidden; min-height: 0; }
  </style>
</head>
<body>
  <p class="page-intro">Click the button at the bottom-right to open the chat. Enter at least <strong>Email</strong> or <strong>Mobile</strong>, then start chatting.</p>

  <div id="guest-chat-widget">
    <div id="guest-chat-panel">
      <details class="config-bar">
        <summary>API URL</summary>
        <input type="text" id="api-base-url" value="" placeholder="http://localhost:5002" />
      </details>
      <div class="chat-header">
        <div>
          <h2>Chat</h2>
          <span class="status" id="chat-status">Not connected</span>
        </div>
        <button type="button" id="guest-chat-close" aria-label="Close">×</button>
      </div>

      <div id="guest-chat-content">
        <form class="chat-start-form" id="guest-start-form">
          <p class="hint">At least one of Email or Mobile is required.</p>
          <label>First name</label>
          <input type="text" id="guest-first-name" placeholder="Optional" />
          <label>Last name</label>
          <input type="text" id="guest-last-name" placeholder="Optional" />
          <label>Email</label>
          <input type="email" id="guest-email" placeholder="you@example.com" />
          <label>Mobile</label>
          <input type="tel" id="guest-mobile" placeholder="+1234567890" />
          <div class="error" id="guest-form-error"></div>
          <button type="submit">Start chat</button>
        </form>

        <div id="guest-chat-room">
          <div class="chat-messages" id="guest-messages"></div>
          <div class="chat-input-area">
            <input type="text" id="guest-message-input" placeholder="Message..." maxlength="2000" />
            <button type="button" id="guest-send-btn" aria-label="Send">↑</button>
          </div>
        </div>
      </div>
    </div>
    <button type="button" id="guest-chat-toggle" aria-label="Open chat">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H5.17L4 17.17V4h16v12z"/></svg>
    </button>
  </div>

  <script>
    (function () {
      const API_BASE_KEY = 'guestWidgetApiBase';
      const TOKEN_KEY = 'guestWidgetToken';
      const EXPIRY_KEY = 'guestWidgetExpiresAt';

      function getApiBase() {
        const el = document.getElementById('api-base-url');
        const saved = localStorage.getItem(API_BASE_KEY);
        const value = (el && el.value.trim()) || saved || '';
        if (el && !el.value.trim() && saved) el.value = saved;
        return value || (typeof window !== 'undefined' && window.location.origin) || 'http://localhost:5002';
      }

      function setApiBase(url) {
        localStorage.setItem(API_BASE_KEY, url);
        const el = document.getElementById('api-base-url');
        if (el) el.value = url;
      }

      function getStoredToken() {
        const token = localStorage.getItem(TOKEN_KEY);
        const expiry = localStorage.getItem(EXPIRY_KEY);
        if (!token || !expiry) return null;
        if (new Date(expiry) <= new Date()) {
          localStorage.removeItem(TOKEN_KEY);
          localStorage.removeItem(EXPIRY_KEY);
          return null;
        }
        return token;
      }

      function setStoredToken(token, expiresAt) {
        localStorage.setItem(TOKEN_KEY, token);
        localStorage.setItem(EXPIRY_KEY, expiresAt);
      }

      let connection = null;
      let guestToken = null;

      const panel = document.getElementById('guest-chat-panel');
      const toggle = document.getElementById('guest-chat-toggle');
      const closeBtn = document.getElementById('guest-chat-close');
      const startForm = document.getElementById('guest-start-form');
      const formError = document.getElementById('guest-form-error');
      const chatRoom = document.getElementById('guest-chat-room');
      const messagesEl = document.getElementById('guest-messages');
      const inputEl = document.getElementById('guest-message-input');
      const sendBtn = document.getElementById('guest-send-btn');
      const statusEl = document.getElementById('chat-status');

      function setStatus(text) {
        if (statusEl) statusEl.textContent = text;
      }

      function showForm() {
        if (startForm) startForm.style.display = 'flex';
        if (chatRoom) chatRoom.style.display = 'none';
        if (formError) formError.textContent = '';
      }

      function showChat() {
        if (startForm) startForm.style.display = 'none';
        if (chatRoom) chatRoom.style.display = 'flex';
      }

      function appendMessage(content, isSent, time) {
        const div = document.createElement('div');
        div.className = 'chat-message ' + (isSent ? 'sent' : 'received');
        const t = time || new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        div.innerHTML = '<span class="text"></span><div class="time">' + t + '</div>';
        div.querySelector('.text').textContent = content;
        messagesEl.appendChild(div);
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }

      function connectSignalR(token) {
        const base = getApiBase().replace(/\/$/, '');
        const hubUrl = base + '/guestHub';
        const url = hubUrl + '?access_token=' + encodeURIComponent(token);
        if (connection) {
          connection.stop();
          connection = null;
        }
        connection = new signalR.HubConnectionBuilder()
          .withUrl(url)
          .withAutomaticReconnect()
          .build();

        connection.on('ReceiveMessage', function (msg) {
          const content = msg && (msg.content || msg.Content);
          if (content) appendMessage(content, false);
        });
        connection.on('MessageSent', function (msg) {
          const content = msg && (msg.content || msg.Content);
          if (content) appendMessage(content, true);
        });

        connection.start()
          .then(function () { setStatus('Connected'); })
          .catch(function (err) {
            setStatus('Disconnected');
            console.error('SignalR error', err);
          });
        connection.onclose(function () { setStatus('Disconnected'); });
      }

      function sendMessageViaRest(content, appendOnSuccess) {
        const base = getApiBase().replace(/\/$/, '');
        fetch(base + '/api/v1/guest/messages', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Guest-Token': guestToken },
          body: JSON.stringify({ content: content })
        })
          .then(function (r) {
            if (!r.ok) return r.json().then(function (d) { throw new Error((d.message && (Array.isArray(d.message) ? d.message[0] : d.message)) || r.statusText); });
            return r.json();
          })
          .then(function () {
            if (appendOnSuccess) appendMessage(content, true);
          })
          .catch(function (err) { setStatus('Send failed'); if (formError) formError.textContent = err.message; });
      }

      function sendMessage(content) {
        if (!content || !guestToken) return;
        if (formError) formError.textContent = '';
        var isConnected = connection && connection.state === signalR.HubConnectionState.Connected;
        sendMessageViaRest(content, !isConnected);
      }

      toggle.addEventListener('click', function () {
        const open = panel.classList.toggle('visible');
        toggle.classList.toggle('open', open);
        if (open) {
          const url = document.getElementById('api-base-url');
          if (url && url.value) setApiBase(url.value.trim());
        }
      });

      closeBtn.addEventListener('click', function () {
        panel.classList.remove('visible');
        toggle.classList.remove('open');
      });

      startForm.addEventListener('submit', function (e) {
        e.preventDefault();
        formError.textContent = '';
        const firstName = (document.getElementById('guest-first-name').value || '').trim();
        const lastName = (document.getElementById('guest-last-name').value || '').trim();
        const email = (document.getElementById('guest-email').value || '').trim();
        const mobile = (document.getElementById('guest-mobile').value || '').trim();
        if (!email && !mobile) {
          formError.textContent = 'Enter at least Email or Mobile.';
          return;
        }

        const base = getApiBase().replace(/\/$/, '');
        setStatus('Connecting…');
        fetch(base + '/api/v1/guest/session', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            firstName: firstName || undefined,
            lastName: lastName || undefined,
            email: email || undefined,
            mobile: mobile || undefined
          })
        })
          .then(function (r) {
            if (!r.ok) return r.json().then(function (d) { throw new Error((d.message && (Array.isArray(d.message) ? d.message[0] : d.message)) || r.statusText); });
            return r.json();
          })
          .then(function (data) {
            const payload = data.data || data;
            const token = payload && payload.guestToken;
            const expiresAt = payload && payload.expiresAt;
            if (!token) throw new Error('No token in response');
            guestToken = token;
            setStoredToken(token, expiresAt || new Date(Date.now() + 24 * 60 * 60 * 1000).toISOString());
            showChat();
            connectSignalR(token);
            setStatus('Connected');
          })
          .catch(function (err) {
            formError.textContent = err.message || 'Failed to start session';
            setStatus('Error');
          });
      });

      sendBtn.addEventListener('click', function () {
        const text = (inputEl && inputEl.value || '').trim();
        if (!text) return;
        sendMessage(text);
        if (inputEl) inputEl.value = '';
      });

      inputEl.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendBtn.click();
        }
      });

      document.getElementById('api-base-url').addEventListener('change', function () {
        setApiBase(this.value.trim());
      });

      (function init() {
        var urlEl = document.getElementById('api-base-url');
        if (urlEl && !urlEl.value.trim() && !localStorage.getItem(API_BASE_KEY)) {
          urlEl.value = window.location.origin;
          setApiBase(window.location.origin);
        }
        var saved = getStoredToken();
        if (saved) {
          guestToken = saved;
          showChat();
          connectSignalR(saved);
        } else {
          showForm();
        }
      })();
    })();
  </script>
</body>
</html>
