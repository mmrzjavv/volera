# Coturn STUN/TURN for WebRTC (voice / video / screen share).
# Clients must reach this host:port from their network (public IP or internal DNS).
# Do not point browsers at the Docker service name "coturn".

listening-port=3478
fingerprint
lt-cred-mech

realm=volera
server-name=volera

# Relay port range (must match published ports in docker-compose.yml)
# Avoid Windows Hyper-V reserved ephemeral range (49152+); use 40000-40050.
min-port=40000
max-port=40050

# Logging
log-file=stdout
simple-log
no-cli
no-multicast-peers
no-software-attribute
no-stdout-timestamps

# Allow clients behind NAT / different networks
mobility
no-tls
no-dtls
